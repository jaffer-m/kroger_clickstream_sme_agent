command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--app-dir", "backend"]
env:
  - name: DEFAULT_CATALOG
    value: "kr_behavioral_analytics_prod"
  - name: ALATION_CATALOG
    value: "kr_behavioral_analytics_prod"
  - name: ANTHROPIC_BASE_URL
    value: "YOUR_ANTHROPIC_PROXY_URL"
  - name: ANTHROPIC_API_KEY
    value: "YOUR_ANTHROPIC_API_KEY"
  - name: DATABRICKS_TOKEN
    value: "YOUR_DATABRICKS_PAT"
  - name: SQL_WAREHOUSE_ID
    value: "YOUR_SQL_WAREHOUSE_ID"
  - name: GENIE_SPACE_ID
    value: "YOUR_GENIE_SPACE_ID"
