command: ["sh", "-c", "cd backend && uvicorn main:app --host 0.0.0.0 --port 8000"]
env:
  - name: DEFAULT_CATALOG
    value: "kr_behavioral_analytics_prod"
  # DATABRICKS_HOST is injected automatically by Databricks Apps
  - name: SQL_WAREHOUSE_ID
    valueFrom:
      secretRef:
        scope: kroger-sme-agent
        key: sql_warehouse_id
  - name: DATABRICKS_TOKEN
    valueFrom:
      secretRef:
        scope: kroger-sme-agent
        key: databricks_token
  - name: GENIE_SPACE_ID
    valueFrom:
      secretRef:
        scope: kroger-sme-agent
        key: genie_space_id
  # Optional: only set if using an internal AI proxy instead of the public Anthropic API
  # - name: ANTHROPIC_BASE_URL
  #   valueFrom:
  #     secretRef:
  #       scope: kroger-sme-agent
  #       key: anthropic_base_url
  - name: ANTHROPIC_API_KEY
    valueFrom:
      secretRef:
        scope: kroger-sme-agent
        key: anthropic_api_key
  # Optional: Alation catalog enrichment
  - name: ALATION_BASE_URL
    valueFrom:
      secretRef:
        scope: kroger-sme-agent
        key: alation_base_url
  - name: ALATION_REFRESH_TOKEN
    valueFrom:
      secretRef:
        scope: kroger-sme-agent
        key: alation_refresh_token
  - name: ALATION_USER_ID
    valueFrom:
      secretRef:
        scope: kroger-sme-agent
        key: alation_user_id
  - name: ALATION_DS_ID
    valueFrom:
      secretRef:
        scope: kroger-sme-agent
        key: alation_ds_id
  - name: ALATION_CATALOG
    value: "kr_behavioral_analytics_prod"
